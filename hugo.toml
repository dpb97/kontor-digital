baseURL = "https://dpb97.github.io/kontor-digital/"
languageCode = "de-DE"
defaultContentLanguage = "de"
title = "Kontor Digitalisierung – Digitalisierung, Automatisierung & KI für Maschinenbau & Fertigung"
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[outputFormats.download]
  mediaType = "text/html"
  isHTML = true
  baseName = "index"
  path = "download"

[params]
  product = "Kontor"
  line = "Digitalisierung, Automatisierung & KI"
  contactEmail = "danijel.antonijevic@gmail.com"
  erpUrl = "https://dpb97.github.io/kontor-erp/"

  kicker = "Beratung für Digitalisierung, Automatisierung und KI im Maschinenbau"
  tagline = "Bevor wir über Software sprechen, verstehen wir Ihre Prozesse."
  description = "Wir nehmen Ihre Abläufe in Fertigung und Verwaltung auf, decken auf, wo Informationen zwischen Papier, Excel, Mail und System verloren gehen, und schließen diese Lücken mit passender Digitalisierung, Automatisierung und KI, in dieser Reihenfolge: nicht jede Lücke braucht ein Sprachmodell."
  audience = "Maschinenbau · Fertigung · Anlagenbau · Mittelstand"

  [[params.faq]]
    q = "Wir haben keine eigene IT-Abteilung, geht das trotzdem?"
    a = "Ja, gerade dafür sind wir da. Wir arbeiten direkt mit Ihrer Geschäftsführung und Ihren bestehenden externen Dienstleistern, ohne dass Sie zusätzliches IT-Personal aufbauen müssen."

  [[params.faq]]
    q = "Ersetzt ihr unsere IT oder unsere Dienstleister?"
    a = "Nein. Wir ergänzen Ihre bestehende IT-Landschaft und stimmen uns mit Ihren Dienstleistern ab, statt Parallelstrukturen aufzubauen."

  [[params.faq]]
    q = "Ist KI für unsere Betriebsgröße überhaupt relevant?"
    a = "Relevant ist nicht die Betriebsgröße, sondern der Anwendungsfall. Wir suchen gezielt nach KI-Einsatzfeldern, die sich in einem mittelständischen Fertigungsbetrieb tatsächlich rechnen."

  [[params.faq]]
    q = "Wie schnell sehen wir erste Ergebnisse?"
    a = "Nach der Prozessaufnahme erhalten Sie eine priorisierte Roadmap mit konkreten, kurzfristig umsetzbaren Maßnahmen, nicht erst nach einem Jahr Konzeptphase."

  [[params.faq]]
    q = "Was passiert nach dem Erstgespräch?"
    a = "Sie entscheiden, ob und in welchem Umfang wir weitermachen. Das Erstgespräch ist unverbindlich und kostenlos."
