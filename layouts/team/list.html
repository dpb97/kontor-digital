{{ define "main" }}

{{ partial "nav.html" . }}

<main class="max-w-2xl mx-auto px-6 py-20">
  <p class="text-xs uppercase tracking-[0.15em] text-gold mb-3">Team</p>
  <h1 class="font-serif text-navy text-3xl mb-10">Bei Kontor</h1>
  <div class="border-t border-line divide-y divide-line">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="block py-5 group">
      <h2 class="font-serif text-navy text-lg group-hover:text-gold transition-colors">{{ .Params.name }}</h2>
      <p class="text-sm text-ink/60">{{ .Params.role }}</p>
    </a>
    {{ end }}
  </div>
</main>

{{ partial "footer.html" . }}

{{ end }}
